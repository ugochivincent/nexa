<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexa — Connect. Share. Discover.</title>

  <link rel="stylesheet" href="/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="topbar">
    <div class="logo">Nexa</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Friends</a>
      <a href="#">Messages</a>
      <a href="#">Notifications</a>
    </nav>
  </header>

  <main class="welcome">

    <section id="authSection">
      <h1>Welcome to Nexa</h1>

      <p>Connect. Share. Discover.</p>

      <form id="authForm">

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <button type="submit">
          Continue with email
        </button>

      </form>

      <p id="authMessage"></p>
    </section>

    <section id="profileSection" style="display: none;">

      <h1>Welcome to Nexa!</h1>

      <p id="userEmail"></p>

      <button id="logoutButton">
        Log out
      </button>

    </section>

  </main>

  <script src="/js/app.js"></script>

</body>
</html>
